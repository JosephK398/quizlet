version: "3.9"

# ─────────────────────────────────────────────────────────────
# QuizBlast — docker-compose.yml
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up -d             # background after first build
#   docker compose down              # stop
#
# Access:  http://localhost:3001
#          http://<your-LAN-IP>:3001  (for other devices)
# ─────────────────────────────────────────────────────────────

services:
  quizblast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quizblast
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Persist the SQLite database across container restarts
      - quizblast_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  quizblast_data:
    driver: local
